name: EAS OTA Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development
      message:
        description: 'Update message / changelog'
        required: false
        default: 'OTA update'

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA Update
        run: |
          MSG="${{ github.event.inputs.message }} (commit ${{ github.sha }})"
          eas update --channel ${{ github.event.inputs.channel }} --message "$MSG" --non-interactive
